server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  resolver 8.8.8.8 8.8.4.4 valid=300s;
  resolver_timeout 5s;

  # Static SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls directly to SideQuest Cloud Run Backend
  location /api/ {
    proxy_pass https://sidequest-backend-917216410511.asia-east1.run.app/api/;
    proxy_set_header Host sidequest-backend-917216410511.asia-east1.run.app;
    proxy_ssl_server_name on;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    chunked_transfer_encoding on;
  }

  location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?|csv)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}
